name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      # The .project store lives on the projectman branch (a worktree at
      # .project locally); tests that guard the ADRs read it from there.
      - name: Check out the .project store
        uses: actions/checkout@v6
        with:
          ref: projectman
          path: .project

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No fastembed: with it every store write embeds through the real model,
      # which multiplies the suite's runtime across the matrix. numpy keeps
      # the stubbed-model embedding tests running; the integration jobs below
      # install [all] and cover the real embedding path.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,web]" numpy

      # Timing benchmarks compare speedups that a shared runner running four
      # xdist workers cannot hold steady; they stay on for local runs.
      - name: Run unit tests
        env:
          PROJECTMAN_SKIP_BENCH: "1"
        run: |
          pip install pytest pytest-tmp-files httpx pytest-xdist
          python -m pytest tests/ -v -n auto \
            --ignore=tests/integration \
            --ignore=tests/web \
            --ignore=tests/test_pr_workflow_integration.py \
            --ignore=tests/test_create_pr.py \
            --ignore=tests/test_hub_pr_workflow.py \
            --ignore=tests/test_feature_branch_workflow.py \
            --ignore=tests/test_simultaneous_prs.py

  integration-stdio:
    name: "Integration: STDIO transport"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-tmp-files httpx

      - name: Run STDIO integration tests
        run: python -m pytest tests/integration/test_stdio.py -v

  integration-sse:
    name: "Integration: SSE transport"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-tmp-files httpx

      - name: Run SSE integration tests
        run: python -m pytest tests/integration/test_sse.py -v

  integration-full:
    name: "Integration: Full Suite"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-tmp-files httpx

      - name: Run full integration test suite
        run: python -m pytest tests/integration/test_full.py tests/integration/test_cache_staleness.py -v

  integration-web:
    name: "Integration: Web UI"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-tmp-files httpx

      - name: Run Web integration tests
        run: python -m pytest tests/web/ -v
